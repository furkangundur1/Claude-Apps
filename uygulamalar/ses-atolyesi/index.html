<title>Ses Atölyesi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Düzen: stüdyo masası — üstte kontrol çubuğu ve zaman göstergesi, solda kütüphane + denetçi, ortada izler ve zaman çizelgesi, altta editörler (piyano rulosu, adım sıralayıcı, mikser, akıllı kontroller). Bilinçli olarak tek koyu tema. */
:root{
  --bg:#17181b; --chrome:#24262b; --panel:#1d1f23; --panel2:#2b2e34; --line:#363941; --line2:#2a2c32;
  --fg:#e4e6ea; --muted:#8f949d; --dim:#5d626b;
  --accent:#f0b44a; --accent-ink:#1a1305; --cycle:#e0a33a; --play:#58c98b; --rec:#ef5b55; --sel:#5fa8ff;
  --lane:#1b1c20; --lane2:#202227; --grid:#2c2f36; --grid2:#25272d;
  --ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.35 var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

/* ---- kontrol çubuğu ---- */
.bar{display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--chrome);border-bottom:1px solid #000;min-width:0;overflow-x:auto;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.grp{display:flex;align-items:center;gap:4px;flex:none}
.tb{height:30px;min-width:30px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--fg);font-size:12px;white-space:nowrap}
.tb:hover{border-color:#4a4e57}
.tb.on{background:#3a3d45;border-color:#5a5f6a}
.tb svg{width:16px;height:16px;flex:none}
.tb.play.on{color:var(--play);border-color:var(--play)}
.tb.rec.on{color:#fff;background:var(--rec);border-color:var(--rec)}
.tb.cyc.on{color:var(--accent-ink);background:var(--cycle);border-color:var(--cycle)}
.tb.typ.on{color:var(--accent)}
.lcd{display:flex;align-items:stretch;gap:0;background:#0f1012;border:1px solid #000;border-radius:7px;box-shadow:inset 0 1px 0 #ffffff08;flex:none}
.lcd .cell{padding:3px 10px;display:grid;justify-items:center;border-right:1px solid #24262b}
.lcd .cell:last-child{border-right:0}
.lcd b{font:600 17px/1.1 var(--mono);color:#cfe6ff;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.lcd small{font:500 9px/1.1 var(--ui);color:#6f7682;text-transform:uppercase;letter-spacing:.08em}
.lcd input,.lcd select{width:54px;background:transparent;border:0;text-align:center;font:600 17px/1.1 var(--mono);color:#cfe6ff;padding:0;-moz-appearance:textfield}
.lcd select{width:auto;font-size:15px;appearance:none;cursor:pointer}
.lcd input::-webkit-inner-spin-button{display:none}
.brand{font-weight:700;letter-spacing:.01em;font-size:13px;margin-right:4px;display:flex;align-items:center;gap:7px;flex:none}
.brand i{width:20px;height:20px;border-radius:5px;background:conic-gradient(from 200deg,var(--accent),#e8683f,#5fa8ff,var(--accent));display:block}
.spacer{flex:1}

/* ---- ana alan ---- */
.main{display:grid;grid-template-columns:auto auto minmax(0,1fr);min-height:0}
.side{background:var(--panel);border-right:1px solid #000;overflow:auto;min-height:0;width:220px}
.side[hidden]{display:none}
.side h3{margin:0;padding:8px 10px 6px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel);z-index:1}
.libcat{padding:2px 6px 8px}
.libcat .ch{font-size:11px;color:var(--dim);padding:6px 6px 3px;text-transform:uppercase;letter-spacing:.06em}
.libitem{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border:0;background:none;border-radius:5px;text-align:left;font-size:12.5px}
.libitem:hover{background:var(--panel2)}
.libitem.on{background:#2f3a4d;color:#d9e8ff}
.libitem svg{width:15px;height:15px;color:var(--muted);flex:none}
.insp{padding:4px 10px 12px;display:grid;gap:10px}
.insp .sec{display:grid;gap:7px;padding-bottom:10px;border-bottom:1px solid var(--line2)}
.insp .sec:last-child{border-bottom:0}
.insp .t{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.row label{flex:1;color:var(--muted);font-size:12px;min-width:0}
.row output{font:500 11.5px var(--mono);color:var(--fg);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.txt{width:100%;background:#121315;border:1px solid var(--line);border-radius:5px;padding:5px 7px}
.sw{display:flex;gap:5px;flex-wrap:wrap}
.sw button{width:18px;height:18px;border-radius:4px;border:2px solid transparent;padding:0}
.sw button.on{border-color:#fff}
input[type=range]{width:100%;accent-color:var(--accent);height:18px;margin:0}
.knobs{display:flex;flex-wrap:wrap;gap:6px 4px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.sbtn{padding:5px 9px;border:1px solid var(--line);background:var(--panel2);border-radius:5px;font-size:12px}
.sbtn:hover{border-color:#50555f}
.sbtn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}

/* ---- izler alanı ---- */
.center{display:grid;grid-template-rows:minmax(120px,1fr) auto;min-width:0;min-height:0}
.tracks{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:0;background:var(--lane)}
.thead{background:var(--panel);border-right:1px solid #000;display:grid;grid-template-rows:30px minmax(0,1fr);min-height:0}
.thead .top{display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:1px solid #000;background:var(--chrome)}
.thead .top b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);flex:1}
.hlist{overflow:hidden;position:relative}
.hl-inner{position:absolute;left:0;right:0;top:0}
.th{height:64px;display:grid;grid-template-columns:6px 26px minmax(0,1fr);border-bottom:1px solid #000;background:#212328;cursor:default}
.th.sel{background:#2a3140}
.th .cs{background:var(--c)}
.th .ic{display:grid;place-items:center;color:var(--muted)}
.th .ic svg{width:18px;height:18px}
.th .bd{padding:7px 8px 6px 2px;display:grid;gap:6px;min-width:0}
.th .nm{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .ctl{display:flex;gap:4px;align-items:center}
.ms{width:22px;height:18px;border-radius:4px;border:1px solid var(--line);background:var(--panel2);font:700 10px var(--ui);color:var(--muted);padding:0}
.ms.m.on{background:#5a8de0;color:#fff;border-color:#5a8de0}
.ms.s.on{background:#e3c34a;color:#1a1505;border-color:#e3c34a}
.ms.r.on{background:var(--rec);color:#fff;border-color:var(--rec)}
.mini-meter{flex:1;height:5px;background:#101114;border-radius:3px;overflow:hidden;margin-left:4px}
.mini-meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3fbf72 0 70%,#e2c044 85%,#e5534b)}
.tl{position:relative;display:grid;grid-template-rows:30px minmax(0,1fr);min-width:0;min-height:0}
.ruler{position:relative;background:var(--chrome);border-bottom:1px solid #000;overflow:hidden;cursor:pointer}
.ruler canvas{position:absolute;left:0;top:0}
.lanes{overflow:auto;position:relative}
.lanes-inner{position:relative}
.lane{position:absolute;left:0;height:64px;border-bottom:1px solid #000}
.lane.alt{background:var(--lane2)}
.lane.sel{background:#1f2430}
.reg{position:absolute;top:2px;height:59px;border-radius:5px;background:color-mix(in srgb,var(--c) 30%,#15161a);border:1px solid color-mix(in srgb,var(--c) 75%,#000);overflow:hidden;cursor:grab}
.reg.sel{border-color:#fff;box-shadow:0 0 0 1px #fff inset}
.reg .rn{position:absolute;left:0;right:0;top:0;height:15px;padding:1px 6px;font-size:10.5px;font-weight:600;color:#111;background:color-mix(in srgb,var(--c) 92%,#fff);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reg canvas{position:absolute;left:0;top:15px}
.reg .rz{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:ew-resize}
.playhead{position:absolute;top:0;bottom:0;width:1px;background:#fff;pointer-events:none;z-index:5}
.playhead.r{background:var(--rec)}
.gridbg{position:absolute;inset:0;pointer-events:none}

/* ---- editörler ---- */
.ed{background:var(--panel);border-top:1px solid #000;display:grid;grid-template-rows:32px minmax(0,1fr);height:min(330px,45vh);min-height:0}
.ed.closed{height:32px}
.ed.closed .edbody{display:none}
.edtabs{display:flex;align-items:center;gap:2px;padding:0 8px;background:var(--chrome);border-bottom:1px solid #000;overflow-x:auto;scrollbar-width:none}
.edtab{height:24px;padding:0 10px;border:0;border-radius:5px;background:none;color:var(--muted);font-size:12px;font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:6px}
.edtab kbd{font:500 10px var(--mono);color:var(--dim)}
.edtab.on{background:#383b43;color:var(--fg)}
.edtools{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.edtools select,.edtools .sbtn{height:24px;padding:0 8px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;font-size:12px}
.edbody{min-height:0;position:relative}
.pane{position:absolute;inset:0;overflow:auto}
.pane[hidden]{display:none}
.empty{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center;padding:20px;line-height:1.6}
.empty b{color:var(--fg)}
/* piyano rulosu */
.prw{display:flex;width:max-content;position:relative}
.prw canvas{display:block;flex:none}
.prw .keys{position:sticky;left:0;z-index:2}
/* adım sıralayıcı */
.seq{display:grid;gap:3px;padding:10px 12px;min-width:max-content}
.sq-row{display:grid;grid-template-columns:110px repeat(var(--n),22px);gap:3px;align-items:center}
.sq-row .nm{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer;padding-right:4px}
.sq-row .nm:hover{color:var(--fg)}
.cell{height:24px;border-radius:4px;background:#2a2d33;border:0;padding:0}
.cell.beat{background:#33363d}
.cell.on{background:var(--c)}
.cell.acc{box-shadow:inset 0 0 0 2px #fff8}
.cell.ph{outline:1px solid #fff9}
.sq-head{display:grid;grid-template-columns:110px repeat(var(--n),22px);gap:3px;font:500 10px var(--mono);color:var(--dim)}
/* mikser */
.mix{display:flex;gap:2px;padding:8px;height:100%;min-width:max-content}
.strip{width:92px;background:#202227;border:1px solid #000;border-radius:5px;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;gap:5px;padding:6px 5px;justify-items:center}
.strip.sel{background:#262c38}
.strip .snm{font-size:11px;font-weight:600;width:100%;text-align:center;padding:3px 2px;border-radius:3px;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip.master .snm{background:#c9ccd3}
.fader-wrap{display:flex;gap:5px;height:100%;min-height:60px;align-items:stretch}
.fader{width:22px;position:relative;cursor:ns-resize;touch-action:none}
.fader::before{content:"";position:absolute;left:9px;top:0;bottom:0;width:4px;border-radius:2px;background:#0f1012}
.fader i{position:absolute;left:1px;width:20px;height:12px;border-radius:3px;background:linear-gradient(#e9ebef,#9ea3ad);box-shadow:0 1px 3px #000;transform:translateY(-50%)}
.meter{width:8px;background:#0f1012;border-radius:2px;position:relative;overflow:hidden}
.meter i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,#3fbf72 0 65%,#e2c044 82%,#e5534b)}
.db{font:500 10.5px var(--mono);color:var(--muted)}
/* düğme (knob) */
.knob{display:grid;justify-items:center;gap:1px;width:58px;cursor:ns-resize;touch-action:none}
.knob svg{width:38px;height:38px}
.knob .kl{font-size:10px;color:var(--muted);text-align:center;line-height:1.15}
.knob .kv{font:500 10px var(--mono);color:var(--fg)}
.knob.sm{width:38px;gap:0}.knob.sm svg{width:28px;height:28px}.knob.sm .kl{font-size:9px}.knob.sm .kv{font-size:9px}
.knob.big{width:92px}.knob.big svg{width:64px;height:64px}.knob.big .kl{font-size:11.5px}.knob.big .kv{font-size:11px}
.smart{display:flex;gap:18px;padding:16px 18px;flex-wrap:wrap;align-items:flex-start}
.smart .card{background:#202227;border:1px solid #000;border-radius:8px;padding:12px 12px 10px;display:grid;gap:10px}
.smart .card h4{margin:0;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.smart .kn{display:flex;gap:8px;flex-wrap:wrap}
.wsel{display:flex;gap:4px}
.wsel button{padding:4px 7px;border:1px solid var(--line);background:var(--panel2);border-radius:4px;font-size:11px}
.wsel button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* menüler / pencereler */
.pop{position:fixed;z-index:50;background:var(--chrome);border:1px solid #000;border-radius:7px;padding:4px;box-shadow:0 10px 30px #000a;min-width:200px;display:grid}
.pop button{text-align:left;border:0;background:none;padding:7px 10px;border-radius:5px;font-size:12.5px}
.pop button:hover{background:#383b43}
.modal{position:fixed;inset:0;z-index:60;background:#000a;display:grid;place-items:center;padding:16px}
.card2{background:var(--chrome);border:1px solid #000;border-radius:10px;width:min(620px,100%);max-height:85vh;overflow:auto;padding:16px;display:grid;gap:10px}
.card2 h2{margin:0;font-size:16px}
.card2 p{margin:0;color:var(--muted);line-height:1.55;-webkit-user-select:text;user-select:text}
.card2 textarea{width:100%;min-height:180px;background:#111214;border:1px solid var(--line);border-radius:6px;padding:8px;font:11.5px var(--mono);color:var(--fg);-webkit-user-select:text;user-select:text}
.card2 table{border-collapse:collapse;width:100%;font-size:12.5px}
.card2 td{padding:4px 6px;border-bottom:1px solid var(--line2);vertical-align:top}
.card2 td:first-child{font:600 11.5px var(--mono);color:var(--accent);white-space:nowrap;width:140px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#e4e6ea;color:#111;padding:7px 12px;border-radius:7px;font-size:12.5px;z-index:70;box-shadow:0 6px 20px #0008;max-width:calc(100% - 32px)}
.hint{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:#000c;border:1px solid var(--line);padding:12px 16px;border-radius:9px;text-align:center;z-index:6;pointer-events:none;line-height:1.5}
.hint b{color:var(--accent)}

@media (max-width:900px){
  .side{width:190px}
  .tracks{grid-template-columns:150px minmax(0,1fr)}
  .th .ic{display:none}.th{grid-template-columns:6px minmax(0,1fr)}
  .ed{height:250px}
}
@media (max-width:640px){
  .main{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:40;top:56px;bottom:0;left:0;box-shadow:6px 0 20px #000a}
  #insp{left:0}
  .tracks{grid-template-columns:118px minmax(0,1fr)}
  .lcd .cell.hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div class="app" id="app">
  <div class="bar" role="toolbar" aria-label="Kontrol çubuğu">
    <div class="brand"><i></i>Ses Atölyesi</div>
    <div class="grp">
      <button class="tb" id="b-lib" title="Kütüphane (Y)" aria-pressed="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2.5" width="3" height="11" rx=".6"/><rect x="6.5" y="2.5" width="3" height="11" rx=".6"/><path d="M11 3.2l2.6-.7 2 10.5-2.7.6z"/></svg></button>
      <button class="tb" id="b-insp" title="Denetçi (I)" aria-pressed="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6"/><path d="M8 7v4.2M8 4.6v.1"/></svg></button>
    </div>
    <div class="grp">
      <button class="tb" id="b-start" title="Başa dön (Enter)"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="2.5" y="3" width="1.8" height="10"/><path d="M13.5 3v10L5.5 8z"/></svg></button>
      <button class="tb" id="b-rew" title="Bir ölçü geri (,)"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 3v10L1.5 8zM14.5 3v10L8 8z"/></svg></button>
      <button class="tb" id="b-ff" title="Bir ölçü ileri (.)"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 3v10l6.5-5zM1.5 3v10L8 8z"/></svg></button>
      <button class="tb" id="b-stop" title="Durdur (boşluk)"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="3.5" y="3.5" width="9" height="9" rx="1"/></svg></button>
      <button class="tb play" id="b-play" title="Çal / durdur (boşluk)"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l9.5-5.5z"/></svg></button>
      <button class="tb rec" id="b-rec" title="Kaydet (R)"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="8" r="5"/></svg></button>
      <button class="tb cyc" id="b-cyc" title="Döngü (C)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 9.5V7a3 3 0 013-3h7M10.5 1.8L13 4l-2.5 2.2M13 6.5V9a3 3 0 01-3 3H3M5.5 14.2L3 12l2.5-2.2"/></svg></button>
    </div>
    <div class="lcd" aria-label="Zaman göstergesi">
      <div class="cell"><b id="lcd-pos">1 1 1</b><small>ölçü · vuruş · alt</small></div>
      <div class="cell hide-sm"><b id="lcd-time">0:00.0</b><small>süre</small></div>
      <div class="cell"><input id="lcd-bpm" type="number" min="40" max="240" step="1" value="100" aria-label="Tempo"><small>tempo</small></div>
      <div class="cell hide-sm"><b>4/4</b><small>ölçü</small></div>
      <div class="cell hide-sm"><select id="lcd-key" aria-label="Ton"></select><small>ton</small></div>
    </div>
    <div class="grp">
      <button class="tb" id="b-met" title="Metronom (K)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5.5 2h5l2.5 12H3z"/><path d="M8 11l4-7"/></svg></button>
      <button class="tb typ" id="b-typ" title="Müzikal klavye: bilgisayar klavyesiyle çal (Ctrl+K)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1.5" y="4" width="13" height="8" rx="1"/><path d="M4.5 4v5M7.5 4v5M10.5 4v5"/></svg>Klavye</button>
    </div>
    <div class="spacer"></div>
    <div class="grp">
      <button class="tb" id="b-undo" title="Geri al (Ctrl+Z)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 3L2 6l3 3"/><path d="M2.5 6H10a3.5 3.5 0 010 7H6"/></svg></button>
      <button class="tb" id="b-redo" title="Yinele (Ctrl+Shift+Z)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 3l3 3-3 3"/><path d="M13.5 6H6a3.5 3.5 0 000 7h4"/></svg></button>
      <button class="tb" id="b-proj">Proje</button>
      <button class="tb" id="b-help" title="Kısayollar">?</button>
    </div>
  </div>

  <div class="main">
    <aside class="side" id="lib" aria-label="Kütüphane"><h3>Kütüphane</h3><div id="libbody"></div></aside>
    <aside class="side" id="insp" aria-label="Denetçi"><h3>Denetçi</h3><div class="insp" id="inspbody"></div></aside>
    <section class="center">
      <div class="tracks">
        <div class="thead">
          <div class="top"><b>İzler</b><button class="tb" id="b-add" title="Yeni iz (Ctrl+Alt+N)" style="height:22px;min-width:22px;padding:0 6px">+</button></div>
          <div class="hlist" id="hlist"><div class="hl-inner" id="hl"></div></div>
        </div>
        <div class="tl">

const E={ctx:null,master:null,chains:new Map(),playing:false,recording:false,pos:0,schedBeat:0,schedTime:0,anchors:[],timer:0,noise:null,rec:null,live:new Map()};
function ensureAudio(){
  if(E.ctx){if(E.ctx.state!=='running')E.ctx.resume();return;}
  const ctx=E.ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
  const m=E.master=ctx.createGain();m.gain.value=.85;
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-12;comp.ratio.value=3.5;comp.attack.value=.005;comp.release.value=.15;
  const an=E.masterAn=ctx.createAnalyser();an.fftSize=1024;
  m.connect(comp);comp.connect(an);an.connect(ctx.destination);
  // yankı: üretilmiş darbe yanıtı
  const len=Math.floor(ctx.sampleRate*2.6),ir=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2);}
  const rv=E.rev=ctx.createConvolver();rv.buffer=ir;const rvg=ctx.createGain();rvg.gain.value=.7;rv.connect(rvg);rvg.connect(m);
  // eko: noktalı sekizlik, geri beslemeli
  const dl=E.del=ctx.createDelay(2);const fb=ctx.createGain();fb.gain.value=.38;const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2800;
  dl.connect(lp);lp.connect(fb);fb.connect(dl);const dg=ctx.createGain();dg.gain.value=.6;lp.connect(dg);dg.connect(m);
  setDelayTime();
  const nb=E.noise=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  rebuildChains();
}
function setDelayTime(){if(E.del)E.del.delayTime.setTargetAtTime(Math.min(1.9,.75*60/project.bpm),E.ctx.currentTime,.05);}
function rebuildChains(){
  if(!E.ctx)return;
  for(const [id,c] of E.chains)if(!trk(id)){try{c.out.disconnect();c.sr.disconnect();c.sd.disconnect();}catch(e){}E.chains.delete(id);}
  for(const t of project.tracks)if(!E.chains.has(t.id)){
    const ctx=E.ctx,c={};
    c.in=ctx.createGain();c.lo=ctx.createBiquadFilter();c.lo.type='lowshelf';c.lo.frequency.value=220;
    c.hi=ctx.createBiquadFilter();c.hi.type='highshelf';c.hi.frequency.value=4500;
    c.pan=ctx.createStereoPanner();c.fd=ctx.createGain();c.out=ctx.createGain();c.an=ctx.createAnalyser();c.an.fftSize=512;
    c.sr=ctx.createGain();c.sd=ctx.createGain();
    c.in.connect(c.lo);c.lo.connect(c.hi);c.hi.connect(c.pan);c.pan.connect(c.fd);c.fd.connect(c.out);c.out.connect(E.master);c.out.connect(c.an);
    c.out.connect(c.sr);c.sr.connect(E.rev);c.out.connect(c.sd);c.sd.connect(E.del);
    c.buf=new Float32Array(c.an.fftSize);
    E.chains.set(t.id,c);
  }
  syncMix();
}
const dbg=db=>db<=-60?0:Math.pow(10,db/20);
function syncMix(){
  if(!E.ctx)return;const now=E.ctx.currentTime,anySolo=project.tracks.some(t=>t.solo);
  for(const t of project.tracks){const c=E.chains.get(t.id);if(!c)continue;
    const aud=!t.mute&&(!anySolo||t.solo);
    c.fd.gain.setTargetAtTime(dbg(t.vol),now,.015);c.out.gain.setTargetAtTime(aud?1:0,now,.01);c.pan.pan.setTargetAtTime(t.pan,now,.015);
    c.sr.gain.setTargetAtTime(t.rev,now,.02);c.sd.gain.setTargetAtTime(t.del,now,.02);c.lo.gain.setTargetAtTime(t.low,now,.02);c.hi.gain.setTargetAtTime(t.high,now,.02);}
  E.master.gain.setTargetAtTime(dbg(project.masterVol??-2),now,.015);
}
/* ---- sentezleyici sesi ---- */
function synthVoice(t,midi,vel,time){
  const ctx=E.ctx,P=t.params,c=E.chains.get(t.id);if(!c)return null;
  const f=mtof(midi),o1=ctx.createOscillator(),o2=ctx.createOscillator();
  o1.type=P.wave1;o2.type=P.wave2;o1.frequency.value=f;o2.frequency.value=f*Math.pow(2,P.oct2||0);o1.detune.value=-P.detune/2;o2.detune.value=P.detune/2;
  const g1=ctx.createGain(),g2=ctx.createGain();g1.gain.value=1-P.mix;g2.gain.value=P.mix;
  const fl=ctx.createBiquadFilter();fl.type='lowpass';fl.Q.value=P.reso;
  const amp=ctx.createGain();const A=Math.max(.002,P.attack),D=Math.max(.01,P.decay),S=clamp(P.sustain,0,1),R=Math.max(.01,P.release);
  const peakA=.32*vel*P.level;
  const base=clamp(P.cutoff*(.6+.6*vel),40,18000),top=clamp(base*(1+P.envAmt*6),40,19000);
  fl.frequency.setValueAtTime(base,time);fl.frequency.linearRampToValueAtTime(top,time+Math.min(A,.4)+.003);fl.frequency.setTargetAtTime(base+(top-base)*S*.5,time+Math.min(A,.4)+.003,D/3);
  amp.gain.setValueAtTime(0,time);amp.gain.linearRampToValueAtTime(peakA,time+A);amp.gain.setTargetAtTime(peakA*S,time+A,D/3);
  o1.connect(g1);o2.connect(g2);g1.connect(fl);g2.connect(fl);fl.connect(amp);amp.connect(c.in);
  o1.start(time);o2.start(time);
  let stopped=false;
  return {stop(at){if(stopped)return;stopped=true;at=Math.max(at,time+.005);amp.gain.cancelScheduledValues(at);
      if(amp.gain.cancelAndHoldAtTime){amp.gain.cancelAndHoldAtTime(at);}amp.gain.setTargetAtTime(0,at,R/4);
      fl.frequency.cancelScheduledValues(at);const end=at+R*1.6+.05;o1.stop(end);o2.stop(end);
      o2.onended=()=>{try{amp.disconnect();}catch(e){}};}};
}
/* ---- davul sesleri (tamamen sentez) ---- */
function noiseSrc(time){const s=E.ctx.createBufferSource();s.buffer=E.noise;s.loop=true;s.loopStart=Math.random()*.5;s.start(time);return s;}
function env(g,time,peak,dec){g.gain.setValueAtTime(0,time);g.gain.linearRampToValueAtTime(peak,time+.002);g.gain.exponentialRampToValueAtTime(.0008,time+dec);}
function drumHit(t,p,vel,time){
  const ctx=E.ctx,P=t.params,c=E.chains.get(t.id);if(!c)return;const out=c.in,v=vel*P.level;
  const mk=()=>ctx.createGain();
  const kill=(nodes,at)=>nodes.forEach(n=>{try{n.stop(at);}catch(e){}});
  if(p===36||p===35){const o=ctx.createOscillator(),g=mk();o.type='sine';const f0=150*P.kickTune;o.frequency.setValueAtTime(f0*(1+P.punch*1.6),time);o.frequency.exponentialRampToValueAtTime(f0*.32,time+.09);
    env(g,time,.9*v,P.kickDecay);o.connect(g);g.connect(out);o.start(time);kill([o],time+P.kickDecay+.05);
    const n=noiseSrc(time),hp=ctx.createBiquadFilter(),gn=mk();hp.type='highpass';hp.frequency.value=3000;env(gn,time,.25*v*P.punch,.015);n.connect(hp);hp.connect(gn);gn.connect(out);kill([n],time+.05);return;}
  if(p===38||p===40){const n=noiseSrc(time),hp=ctx.createBiquadFilter(),g=mk();hp.type='highpass';hp.frequency.value=1100*P.snareTone;env(g,time,.55*v,.18*P.snareTone+.04);n.connect(hp);hp.connect(g);g.connect(out);kill([n],time+.4);
    const o=ctx.createOscillator(),go=mk();o.type='triangle';o.frequency.setValueAtTime(220*P.snareTone,time);o.frequency.exponentialRampToValueAtTime(160*P.snareTone,time+.06);env(go,time,.45*v,.1);o.connect(go);go.connect(out);o.start(time);kill([o],time+.2);return;}
  if(p===39){const n=noiseSrc(time),bp=ctx.createBiquadFilter(),g=mk();bp.type='bandpass';bp.frequency.value=1400;bp.Q.value=1.1;
    g.gain.setValueAtTime(0,time);[0,.011,.022].forEach(o=>{g.gain.setValueAtTime(.7*v,time+o);g.gain.exponentialRampToValueAtTime(.05,time+o+.009);});g.gain.setValueAtTime(.5*v,time+.031);g.gain.exponentialRampToValueAtTime(.0008,time+.2);
    n.connect(bp);bp.connect(g);g.connect(out);kill([n],time+.25);return;}
  if(p===42||p===46||p===44||p===49){const open=p===46,cr=p===49,dec=(cr?1.3:open?.32:.055)*P.hatDecay;
    const g=mk(),bp=ctx.createBiquadFilter(),hp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=cr?7000:10000;hp.type='highpass';hp.frequency.value=cr?4000:7000;
    const oscs=[2,3,4.16,5.43,6.79,8.21].map(r=>{const o=ctx.createOscillator();o.type='square';o.frequency.value=40*r*(cr?1.1:1);o.connect(bp);o.start(time);return o;});
    const n=noiseSrc(time),gn=mk();gn.gain.value=cr?.7:.35;n.connect(gn);gn.connect(bp);
    bp.connect(hp);hp.connect(g);g.connect(out);env(g,time,(cr?.28:.32)*v,dec);kill([...oscs,n],time+dec+.05);
    if(p===42&&t._openHat){try{t._openHat.gain.cancelScheduledValues(time);t._openHat.gain.setTargetAtTime(0,time,.01);}catch(e){}}
    if(open)t._openHat=g;return;}
  if(p===41||p===45||p===48||p===43||p===47||p===50){const f=p<=43?95:p<=47?135:185;const o=ctx.createOscillator(),g=mk();o.type='sine';o.frequency.setValueAtTime(f*1.6*P.kickTune,time);o.frequency.exponentialRampToValueAtTime(f*P.kickTune,time+.12);
    env(g,time,.7*v,.38);o.connect(g);g.connect(out);o.start(time);kill([o],time+.45);return;}
  if(p===37){const o=ctx.createOscillator(),g=mk(),bp=ctx.createBiquadFilter();o.type='triangle';o.frequency.value=1700;bp.type='bandpass';bp.frequency.value=1700;env(g,time,.6*v,.035);o.connect(bp);bp.connect(g);g.connect(out);o.start(time);kill([o],time+.08);return;}
  if(p===56){const g=mk(),bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=800;bp.Q.value=1.5;const os=[540,800].map(f=>{const o=ctx.createOscillator();o.type='square';o.frequency.value=f;o.connect(bp);o.start(time);return o;});env(g,time,.35*v,.32);bp.connect(g);g.connect(out);kill(os,time+.4);return;}
  if(p===70){const n=noiseSrc(time),hp=ctx.createBiquadFilter(),g=mk();hp.type='highpass';hp.frequency.value=5500;env(g,time,.3*v,.06);n.connect(hp);hp.connect(g);g.connect(out);kill([n],time+.1);return;}
  // eşlenmemiş nota: yüksekliğe göre kısa tık
  const o=ctx.createOscillator(),g=mk();o.frequency.value=mtof(p);env(g,time,.3*v,.12);o.connect(g);g.connect(out);o.start(time);kill([o],time+.15);
}
function trigger(t,p,v,time,dur){if(t.type==='drums')drumHit(t,p,v,time);else{const vc=synthVoice(t,p,v,time);vc&&vc.stop(time+dur);}}

/* ---- zamanlayıcı: ileriye bakan planlama ---- */
const spb=()=>60/project.bpm;
function scheduleRange(a,b,t0){
  const s=spb();
  for(const t of project.tracks)for(const r of t.regions){const rs=r.start,re=r.start+r.len;if(re<=a||rs>=b)continue;
    for(const n of r.notes){if(n.t>=r.len)continue;const nb=rs+n.t;if(nb<a||nb>=b)continue;
      if(E.recording&&E.rec&&E.rec.region===r&&E.rec.fresh.has(n))continue;
      trigger(t,n.p+(r.transpose||0),n.v,t0+(nb-a)*s,Math.max(.03,Math.min(n.d,r.len-n.t))*s);}}
  if(project.metro||E.recording)for(let k=Math.ceil(a-1e-9);k<b;k++)click(t0+(k-a)*s,k%4===0);
}
function tick(){
  const ctx=E.ctx,until=ctx.currentTime+.14,s=spb();let guard=0;
  while(E.schedTime<until&&guard++<200){
    const cyc=project.cycle.on&&!E.recording,cs=project.cycle.start,ce=project.cycle.end;
    let a=E.schedBeat,b=a+.25;
    if(cyc&&a>=ce-1e-9){E.schedBeat=cs;E.anchors.push({time:E.schedTime,beat:cs});continue;}
    if(cyc&&b>ce)b=ce;
    scheduleRange(a,b,E.schedTime);
    E.schedTime+=(b-a)*s;E.schedBeat=b;
    if(cyc&&b>=ce-1e-9){E.schedBeat=cs;E.anchors.push({time:E.schedTime,beat:cs});}
  }
  const now=ctx.currentTime;while(E.anchors.length>2&&E.anchors[1].time<=now)E.anchors.shift();
}
function curBeat(){
  if(!E.playing||!E.ctx)return E.pos;const now=E.ctx.currentTime;let an=E.anchors[0];
  for(const x of E.anchors)if(x.time<=now)an=x;return Math.max(0,an.beat+(now-an.time)/spb());
}
function play(fromRec){
  ensureAudio();if(E.playing){stop();return;}
  if(project.cycle.on&&!fromRec&&(E.pos<project.cycle.start||E.pos>=project.cycle.end))E.pos=project.cycle.start;
  E.playing=true;E.schedBeat=E.pos;E.schedTime=E.ctx.currentTime+.06;E.anchors=[{time:E.schedTime,beat:E.pos}];
  tick();E.timer=setInterval(tick,25);setTransportUI();
}
function stop(){
  if(!E.playing){E.pos=project.cycle.on?project.cycle.start:0;setTransportUI();drawPlayhead(true);return;}
  E.pos=curBeat();if(E.recording)finishRecording();
  E.playing=false;clearInterval(E.timer);setTransportUI();drawPlayhead(true);
}
function record(){
  ensureAudio();
  if(E.recording){stop();return;}
  const t=project.tracks.find(x=>x.arm)||selT();if(!t)return toast('Önce bir iz seç.');
  checkpoint();
  const start=Math.floor(E.pos/4)*4;
  const r={id:uid(),name:'Kayıt',start,len:4,transpose:0,notes:[]};t.regions.push(r);
  E.rec={track:t,region:r,open:new Map(),fresh:new Set()};E.recording=true;E.pos=start-(4);if(E.pos<0)E.pos=0;
  UI.selTrack=t.id;UI.selRegion=r.id;renderAll();
  if(E.playing){E.playing=false;clearInterval(E.timer);}
  E.pos=Math.max(0,start-4);play(true);toast('Kayıt: 1 ölçü ön sayım, sonra çal. Durdurmak için boşluk.');
}
function finishRecording(){
  const R=E.rec;if(!R)return;const end=curBeat();
  for(const [k,o] of R.open)closeRecNote(o,end);R.open.clear();
  R.region.len=Math.max(4,Math.ceil((end-R.region.start)/4)*4);
  if(!R.region.notes.length){R.track.regions=R.track.regions.filter(x=>x!==R.region);toast('Kayıt boş kaldı, bölge silindi.');}
  else toast(R.region.notes.length+' nota kaydedildi.');
  E.recording=false;E.rec=null;save();renderAll();
}
function closeRecNote(o,end){const R=E.rec;const n={p:o.p,t:o.t,d:Math.max(.0625,end-o.start),v:o.v};if(n.t<0)return;R.region.notes.push(n);R.fresh.add(n);
  if(n.t+n.d>R.region.len)R.region.len=Math.ceil((n.t+n.d)/4)*4;renderTimeline();}
/* canlı çalma (klavye, piyano tuşları) */
function liveOn(key,t,midi,vel){
  ensureAudio();if(!t)return;if(E.live.has(key))return;const now=E.ctx.currentTime;
  let vc=null;if(t.type==='drums')drumHit(t,midi,vel,now);else vc=synthVoice(t,midi,vel,now);
  E.live.set(key,{vc,t,midi});
  if(E.recording&&E.rec&&E.rec.track===t){const b=curBeat();if(b>=E.rec.region.start)E.rec.open.set(key,{p:midi,start:b,t:b-E.rec.region.start,v:vel});}
}
function liveOff(key){const l=E.live.get(key);if(!l)return;E.live.delete(key);l.vc&&l.vc.stop(E.ctx.currentTime);
  if(E.recording&&E.rec){const o=E.rec.open.get(key);if(o){E.rec.open.delete(key);closeRecNote(o,curBeat());}}}
function allOff(){for(const k of [...E.live.keys()])liveOff(k);}

/* ---- düğme (knob) bileşeni ---- */
function knob(o){
  const el=document.createElement('div');el.className='knob'+(o.big?' big':o.sm?' sm':'');el.tabIndex=0;el.setAttribute('role','slider');el.setAttribute('aria-label',o.label);
  const fmt=o.fmt||(v=>v.toFixed(2));
  const norm=v=>o.log?Math.log(v/o.min)/Math.log(o.max/o.min):(v-o.min)/(o.max-o.min);
  const den=n=>{n=clamp(n,0,1);let v=o.log?o.min*Math.pow(o.max/o.min,n):o.min+n*(o.max-o.min);if(o.step)v=Math.round(v/o.step)*o.step;return v;};
  let val=o.value;
  const draw=()=>{const n=clamp(norm(val),0,1),a0=-225,a1=a0+270*n,R=15,cx=19,cy=19;
    const pt=a=>[cx+R*Math.cos(a*Math.PI/180),cy+R*Math.sin(a*Math.PI/180)];
    const [x0,y0]=pt(a0),[x1,y1]=pt(a1),[xe,ye]=pt(45);const lg1=a1-a0>180?1:0;
    el.innerHTML=`<svg viewBox="0 0 38 38"><path d="M${x0} ${y0}A${R} ${R} 0 1 1 ${xe} ${ye}" fill="none" stroke="#33363d" stroke-width="3.2" stroke-linecap="round"/>`+
      (n>0.002?`<path d="M${x0} ${y0}A${R} ${R} 0 ${lg1} 1 ${x1} ${y1}" fill="none" stroke="${o.color||'var(--accent)'}" stroke-width="3.2" stroke-linecap="round"/>`:'')+
      `<circle cx="19" cy="19" r="10.5" fill="#2c2f36" stroke="#000" stroke-width=".8"/><line x1="19" y1="19" x2="${19+9*Math.cos(a1*Math.PI/180)}" y2="${19+9*Math.sin(a1*Math.PI/180)}" stroke="#e4e6ea" stroke-width="2" stroke-linecap="round"/></svg><span class="kv">${fmt(val)}</span><span class="kl">${esc(o.label)}</span>`;
    el.setAttribute('aria-valuetext',fmt(val));};
  draw();
  const set=(v,commit)=>{val=v;draw();o.onInput&&o.onInput(v);if(commit)o.onCommit&&o.onCommit(v);};
  let sy=0,sn=0,drag=false;
  el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);sy=e.clientY;sn=norm(val);drag=true;o.onStart&&o.onStart();});
  el.addEventListener('pointermove',e=>{if(!drag)return;const k=e.shiftKey?.0012:.006;set(den(sn+(sy-e.clientY)*k));});
  el.addEventListener('pointerup',()=>{if(drag){drag=false;o.onCommit&&o.onCommit(val);}});
  el.addEventListener('dblclick',()=>{if(o.def!==undefined){o.onStart&&o.onStart();set(o.def,true);}});
  el.addEventListener('wheel',e=>{e.preventDefault();o.onStart&&o.onStart();set(den(norm(val)+(e.deltaY<0?.02:-.02)),true);},{passive:false});
  el.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowRight'){e.preventDefault();e.stopPropagation();set(den(norm(val)+.02),true);}else if(e.key==='ArrowDown'||e.key==='ArrowLeft'){e.preventDefault();e.stopPropagation();set(den(norm(val)-.02),true);}});
  return el;
}

    const fw=document.createElement('div');fw.className='fader-wrap';const db=document.createElement('div');db.className='db';
    const getV=()=>master?(project.masterVol??-2):t.vol;const setV=v=>{if(master)project.masterVol=v;else t.vol=v;db.textContent=fmtDb(v);syncMix();};
    fw.appendChild(fader(getV,setV,()=>checkpoint(),()=>save()));const mt=document.createElement('div');mt.className='meter';mt.innerHTML=`<i data-m="${master?'master':t.id}"></i>`;fw.appendChild(mt);
    db.textContent=fmtDb(getV());
    const ms=document.createElement('div');ms.className='ctl';ms.style.display='flex';ms.style.gap='4px';
    if(!master){[['m','mute','M'],['s','solo','S']].forEach(([c,k,l])=>{const b=document.createElement('button');b.className='ms '+c+(t[k]?' on':'');b.textContent=l;b.onclick=()=>{t[k]=!t[k];syncMix();save();renderHeaders();renderMixer();};ms.appendChild(b);});}
    s.append(nm,row1,fw,db,ms);if(!master)s.addEventListener('pointerdown',e=>{if(e.target===s||e.target===nm)selectTrack(t.id);});
    wrap.appendChild(s);};
  project.tracks.forEach(t=>strip(t,false));strip(null,true);
}

/* ================= AKILLI KONTROLLER ================= */
function renderSmart(){
  const pane=$('p-sc'),t=selT();pane.innerHTML='';if(!t){pane.innerHTML='<div class="empty">İz seçilmedi.</div>';return;}
  const wrap=document.createElement('div');wrap.className='smart';pane.appendChild(wrap);
  const card=(title,list)=>{const c=document.createElement('div');c.className='card';c.innerHTML=`<h4>${esc(title)}</h4>`;const k=document.createElement('div');k.className='kn';list.forEach(x=>k.appendChild(x));c.appendChild(k);wrap.appendChild(c);return c;};
  const P=t.params,pk=(label,key,min,max,fmt,o={})=>knob({big:true,label,min,max,value:P[key],fmt,def:o.def,log:o.log,step:o.step,color:o.color,onStart:kStart,onInput:v=>{P[key]=v;},onCommit:kCommit});
  if(t.type==='drums'){
    card(t.preset+' · davul',[pk('Kick perdesi','kickTune',.5,1.6,v=>Math.round(v*100)+'%',{def:1}),pk('Kick uzunluğu','kickDecay',.1,1.6,fmtS,{def:.45}),pk('Vuruş sertliği','punch',0,1,fmtPct,{def:.6}),pk('Snare tonu','snareTone',.5,1.6,v=>Math.round(v*100)+'%',{def:1}),pk('Hat uzunluğu','hatDecay',.3,2.5,v=>Math.round(v*100)+'%',{def:1}),pk('Seviye','level',0,1.2,fmtPct,{def:.9})]);
  }else{
    const osc=card('Osilatörler',[pk('Karışım','mix',0,1,v=>Math.round((1-v)*100)+' / '+Math.round(v*100),{def:.5}),pk('Akort farkı','detune',0,40,v=>v.toFixed(0)+' sent',{def:8}),pk('2. osilatör oktav','oct2',-2,2,v=>(v>0?'+':'')+v.toFixed(0),{step:1,def:0})]);
    const ws=(key,label)=>{const d=document.createElement('div');d.style.cssText='display:grid;gap:4px';d.innerHTML=`<span style="font-size:10.5px;color:var(--muted)">${label}</span>`;const w=document.createElement('div');w.className='wsel';
      [['sine','Sinüs'],['triangle','Üçgen'],['sawtooth','Testere'],['square','Kare']].forEach(([v,n])=>{const b=document.createElement('button');b.textContent=n;b.className=P[key]===v?'on':'';b.onclick=()=>{checkpoint();P[key]=v;save();renderSmart();audition(t,60,.8);};w.appendChild(b);});d.appendChild(w);return d;};
    osc.appendChild(ws('wave1','1. osilatör dalgası'));osc.appendChild(ws('wave2','2. osilatör dalgası'));
    card('Filtre',[pk('Kesim','cutoff',60,16000,fmtHz,{log:true,def:2400}),pk('Rezonans','reso',.3,18,v=>v.toFixed(1),{def:2}),pk('Zarf miktarı','envAmt',0,4,v=>v.toFixed(2),{def:.4})]);
    card('Genlik zarfı',[pk('Atak','attack',.001,2,fmtS,{log:true,def:.01}),pk('Düşüş','decay',.02,3,fmtS,{log:true,def:.3}),pk('Sürme','sustain',0,1,fmtPct,{def:.6}),pk('Bırakma','release',.01,4,fmtS,{log:true,def:.3}),pk('Seviye','level',0,1.2,fmtPct,{def:.8})]);
  }
  card('Efekt gönderimleri',[knob({big:true,label:'Yankı',min:0,max:1,value:t.rev,fmt:fmtPct,def:.15,color:'#5fa8ff',onStart:kStart,onInput:v=>{t.rev=v;syncMix();},onCommit:kCommit}),knob({big:true,label:'Eko',min:0,max:1,value:t.del,fmt:fmtPct,def:0,color:'#5fa8ff',onStart:kStart,onInput:v=>{t.del=v;syncMix();},onCommit:kCommit})]);
}

/* ================= ölçerler ve döngü ================= */
function meters(){
  if(E.ctx){const peak=an=>{const b=an._b||(an._b=new Float32Array(an.fftSize));an.getFloatTimeDomainData(b);let m=0;for(let i=0;i<b.length;i+=2){const v=Math.abs(b[i]);if(v>m)m=v;}return m;};
    document.querySelectorAll('[data-m]').forEach(el=>{const id=el.dataset.m,an=id==='master'?E.masterAn:E.chains.get(id)?.an;if(!an)return;const p=peak(an),db=20*Math.log10(p+1e-6),n=clamp((db+54)/54,0,1);
      if(el.parentElement.classList.contains('meter'))el.style.height=n*100+'%';else el.style.width=n*100+'%';});}
}
function loop(){requestAnimationFrame(loop);if(E.playing)drawPlayhead();meters();}

/* ================= tuşlar ================= */
const TYPE_MAP={KeyA:0,KeyW:1,KeyS:2,KeyE:3,KeyD:4,KeyF:5,KeyT:6,KeyG:7,KeyY:8,KeyH:9,KeyU:10,KeyJ:11,KeyK:12,KeyO:13,KeyL:14,KeyP:15,Semicolon:16};
document.addEventListener('keydown',e=>{
  const tg=e.target;if(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.tagName==='SELECT')return;
  if(!$('modal')?.hidden&&$('modal')){if(e.key==='Escape')closeModal();return;}
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.code==='KeyZ'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(mod&&e.code==='KeyK'){e.preventDefault();UI.typing=!UI.typing;setTransportUI();toast(UI.typing?'Müzikal klavye açık: A–L satırı notalar, Z/X oktav.':'Müzikal klavye kapalı: harf kısayolları etkin.');return;}
  if(mod&&e.code==='KeyD'){e.preventDefault();dupRegion();return;}
  if(mod&&e.code==='KeyA'&&UI.focus==='pr'){e.preventDefault();const r=selR();if(r){UI.selNotes=new Set(r.notes.map((_,i)=>i));drawPR();}return;}
  if(mod&&e.altKey&&e.code==='KeyN'){e.preventDefault();addTrack('synth');return;}
  if(mod)return;
  if(UI.typing&&!e.altKey&&TYPE_MAP[e.code]!==undefined){e.preventDefault();if(e.repeat)return;const t=selT();const r=selR();
    const idx=TYPE_MAP[e.code];const midi=t&&t.type==='drums'?DRUMS[idx%DRUMS.length].p:60+UI.oct*12+idx+(r&&t&&t.regions.includes(r)?(r.transpose||0):0);liveOn(e.code,t,midi,UI.vel);return;}
  if(UI.typing&&(e.code==='KeyZ'||e.code==='KeyX')){UI.oct=clamp(UI.oct+(e.code==='KeyX'?1:-1),-3,3);toast('Klavye oktavı: C'+(4+UI.oct));return;}
  if(UI.typing&&(e.code==='KeyC'||e.code==='KeyV')){UI.vel=clamp(UI.vel+(e.code==='KeyV'?.1:-.1),.1,1);toast('Vuruş gücü: '+Math.round(UI.vel*127));return;}
  switch(e.code){
    case 'Space':e.preventDefault();E.playing?stop():play();break;
    case 'KeyR':record();break;
    case 'Enter':case 'NumpadEnter':E.pos=0;if(E.playing){stop();play();}else drawPlayhead(true);break;
    case 'Comma':E.pos=Math.max(0,Math.floor((curBeat()-.01)/4)*4);if(E.playing){stop();play();}else drawPlayhead(true);break;
    case 'Period':E.pos=Math.floor(curBeat()/4)*4+4;if(E.playing){stop();play();}else drawPlayhead(true);break;
    case 'KeyC':project.cycle.on=!project.cycle.on;setTransportUI();drawRuler();drawGrid();save();break;
    case 'KeyK':project.metro=!project.metro;setTransportUI();save();break;
    case 'KeyP':setPane('pr');break;case 'KeyS':setPane('sq');break;case 'KeyX':setPane('mx');break;case 'KeyB':setPane('sc');break;
    case 'KeyE':UI.edOpen=!UI.edOpen;renderEditor();break;
    case 'KeyY':UI.lib=!UI.lib;layout();break;case 'KeyI':UI.insp=!UI.insp;layout();break;
    case 'KeyM':{const t=selT();if(t){t.mute=!t.mute;syncMix();save();renderHeaders();}break;}
    case 'Delete':case 'Backspace':{e.preventDefault();const r=selR();if(UI.focus==='pr'&&r&&UI.selNotes.size){checkpoint();r.notes=r.notes.filter((_,i)=>!UI.selNotes.has(i));UI.selNotes.clear();changed();}else delRegion();break;}
    case 'ArrowUp':case 'ArrowDown':{const r=selR();if(UI.focus==='pr'&&r&&UI.selNotes.size){e.preventDefault();checkpoint();const d=(e.code==='ArrowUp'?1:-1)*(e.shiftKey?12:1);UI.selNotes.forEach(i=>r.notes[i].p=clamp(r.notes[i].p+d,0,127));drawPR();save();renderTimeline();}
      else{e.preventDefault();const i=project.tracks.findIndex(t=>t.id===UI.selTrack);const n=project.tracks[clamp(i+(e.code==='ArrowUp'?-1:1),0,project.tracks.length-1)];if(n)selectTrack(n.id);}break;}
    case 'ArrowLeft':case 'ArrowRight':{const r=selR();if(UI.focus==='pr'&&r&&UI.selNotes.size){e.preventDefault();checkpoint();const d=(e.code==='ArrowRight'?1:-1)*UI.grid;UI.selNotes.forEach(i=>r.notes[i].t=Math.max(0,r.notes[i].t+d));drawPR();save();renderTimeline();}break;}
  }
});
document.addEventListener('keyup',e=>{if(TYPE_MAP[e.code]!==undefined)liveOff(e.code);});
window.addEventListener('blur',allOff);
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&e.detail>0)b.blur();});

/* ================= kontrol çubuğu bağlantıları ================= */
$('b-play').onclick=()=>E.playing?stop():play();$('b-stop').onclick=stop;$('b-rec').onclick=record;
$('b-start').onclick=()=>{E.pos=0;if(E.playing){stop();play();}else drawPlayhead(true);};
$('b-rew').onclick=()=>{E.pos=Math.max(0,Math.floor((curBeat()-.01)/4)*4);if(E.playing){stop();play();}else drawPlayhead(true);};
$('b-ff').onclick=()=>{E.pos=Math.floor(curBeat()/4)*4+4;if(E.playing){stop();play();}else drawPlayhead(true);};
$('b-cyc').onclick=()=>{project.cycle.on=!project.cycle.on;setTransportUI();drawRuler();drawGrid();save();};
$('b-met').onclick=()=>{project.metro=!project.metro;setTransportUI();save();};
$('b-typ').onclick=()=>{UI.typing=!UI.typing;setTransportUI();toast(UI.typing?'Müzikal klavye açık: A–L satırı notalar, Z/X oktav, C/V vuruş gücü.':'Müzikal klavye kapalı.');};
$('b-undo').onclick=undo;$('b-redo').onclick=redo;
$('b-lib').onclick=()=>{UI.lib=!UI.lib;layout();};$('b-insp').onclick=()=>{UI.insp=!UI.insp;layout();};
const bpm=$('lcd-bpm');bpm.onchange=()=>{const v=clamp(Math.round(+bpm.value)||100,40,240);checkpoint();project.bpm=v;bpm.value=v;setDelayTime&&E.ctx&&setDelayTime();if(E.playing){stop();play();}save();drawPlayhead(true);};
const ks=$('lcd-key');KEYS_LIST.forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k;ks.appendChild(o);});ks.onchange=()=>{checkpoint();project.key=ks.value;save();if(UI.pane==='sq')renderSeq();};
function layout(){$('lib').hidden=!UI.lib;$('insp').hidden=!UI.insp;setTransportUI();requestAnimationFrame(renderTimeline);}

/* proje penceresi ve yardım */
function modal(html){closeModal();const m=document.createElement('div');m.className='modal';m.id='modal';m.innerHTML=`<div class="card2" role="dialog">${html}</div>`;document.body.appendChild(m);m.addEventListener('pointerdown',e=>{if(e.target===m)closeModal();});return m;}
function closeModal(){$('modal')?.remove();}
$('b-proj').onclick=()=>{const m=modal(`<h2>Proje</h2><p>Projen bu tarayıcıda otomatik kaydedilir. Yedeklemek ya da başka bir cihaza taşımak için metni kopyalayıp sakla; geri yüklemek için buraya yapıştır.</p>
  <textarea id="pj" spellcheck="false" aria-label="Proje metni">${esc(JSON.stringify(project))}</textarea>
  <div class="btnrow"><button class="sbtn pri" id="pj-copy">Kopyala</button><button class="sbtn" id="pj-load">Yapıştırılanı yükle</button><button class="sbtn" id="pj-demo">Örnek şarkıyı aç</button><button class="sbtn" id="pj-new">Boş proje</button><button class="sbtn" id="pj-x" style="margin-left:auto">Kapat</button></div><p id="pj-msg"></p>`);
  const msg=t=>m.querySelector('#pj-msg').textContent=t;
  m.querySelector('#pj-copy').onclick=()=>{const ta=m.querySelector('#pj');navigator.clipboard.writeText(ta.value).then(()=>msg('Panoya kopyalandı.')).catch(()=>{ta.select();msg('Otomatik kopyalama izin verilmedi; metin seçildi, Ctrl+C ile kopyala.');});};
  m.querySelector('#pj-load').onclick=()=>{try{const p=JSON.parse(m.querySelector('#pj').value);if(!p||!Array.isArray(p.tracks)||typeof p.bpm!=='number')throw new Error('"tracks" listesi ya da "bpm" alanı yok.');checkpoint();stopAll();project=p;afterLoad();syncTop();msg('Proje yüklendi.');}catch(err){msg('Yüklenemedi: '+(err instanceof SyntaxError?'metin geçerli bir proje değil ('+err.message+').':err.message));}};
  m.querySelector('#pj-demo').onclick=()=>{checkpoint();stopAll();project=demo();afterLoad();syncTop();closeModal();toast('Örnek şarkı açıldı.');};
  m.querySelector('#pj-new').onclick=()=>{checkpoint();stopAll();project={name:'Yeni proje',bpm:120,key:'C majör',bars:32,cycle:{on:true,start:0,end:16},metro:true,tracks:[newTrack('drums','Davullar'),newTrack('synth','Enstrüman 2','Elektrik Piyano')]};project.tracks[0].color=COLORS[1];project.tracks[1].color=COLORS[5];afterLoad();syncTop();closeModal();toast('Boş proje açıldı. Önceki hâline Ctrl+Z ile dönebilirsin.');};
  m.querySelector('#pj-x').onclick=closeModal;};
function stopAll(){if(E.playing)stop();allOff();}
$('b-help').onclick=()=>{modal(`<h2>Kısayollar</h2><table>
<tr><td>Boşluk</td><td>Çal / durdur (durmuşken tekrar: başa)</td></tr><tr><td>R</td><td>Kaydet (1 ölçü ön sayım; kayda hazır ya da seçili ize)</td></tr>
<tr><td>C · K</td><td>Döngü · metronom</td></tr><tr><td>Enter · , · .</td><td>Başa dön · bir ölçü geri · ileri</td></tr>
<tr><td>Ctrl+K</td><td>Müzikal klavyeyi aç/kapat</td></tr><tr><td>A W S E D F T G Y H U J K</td><td>Klavye açıkken notalar (C'den C'ye)</td></tr><tr><td>Z / X · C / V</td><td>Oktav aşağı/yukarı · vuruş gücü</td></tr>
<tr><td>P · S · X · B · E</td><td>Piyano rulosu · adım sıralayıcı · mikser · akıllı kontroller · editörü gizle (klavye kapalıyken)</td></tr>
<tr><td>Y · I</td><td>Kütüphane · denetçi (klavye kapalıyken)</td></tr><tr><td>Ctrl+Z · Ctrl+Shift+Z</td><td>Geri al · yinele</td></tr><tr><td>Ctrl+D · Delete</td><td>Bölgeyi çoğalt · sil</td></tr>
<tr><td>Çift tık (iz)</td><td>Boş bölge oluştur</td></tr><tr><td>Alt+sürükle</td><td>Bölgeyi ya da notayı kopyalayarak taşı</td></tr><tr><td>Shift+sürükle</td><td>Bölgeyi on altılık adımla taşı (normalde vuruş)</td></tr><tr><td>Davul izinde klavye</td><td>A=Kick, W=Snare, S=Clap, E=Kapalı hat, D=Açık hat …</td></tr>
<tr><td>Piyano rulosu</td><td>Tıkla: nota · sürükle: taşı · sağ kenar: uzat · sağ tık/çift tık: sil · ↑↓: transpoze (Shift: oktav) · ←→: kaydır</td></tr>
<tr><td>Cetvel</td><td>Alt yarıya tıkla: konum · üst yarıda sürükle: döngü aralığı</td></tr></table>
<p>Sesler tamamen tarayıcıda sentezlenir; dış örnek dosyası kullanılmaz.</p><div class="btnrow"><button class="sbtn pri" onclick="document.getElementById('modal').remove()">Tamam</button></div>`);};

/* ================= başlat ================= */
function syncTop(){bpm.value=project.bpm;ks.value=project.key||'C majör';setTransportUI();}
function renderAll(){renderHeaders();renderTimeline();renderInsp();renderLib();renderEditor();setTransportUI();}
project=load();UI.selTrack=project.tracks[0]?.id||null;UI.selRegion=project.tracks[0]?.regions[0]?.id||null;
if(innerWidth<900){UI.lib=false;}if(innerWidth<640){UI.insp=false;}
syncTop();layout();renderAll();
new ResizeObserver(()=>{renderTimeline();}).observe($('lanes'));
const hint=$('hint');hint.innerHTML='<b>Boşluk</b> tuşuna bas ya da ▶ düğmesine tıkla: örnek şarkı çalar.<br>Klavyedeki <b>A S D F G H J</b> tuşlarıyla seçili izi çalabilirsin.';hint.hidden=false;
const hideHint=()=>{hint.hidden=true;document.removeEventListener('pointerdown',hideHint);document.removeEventListener('keydown',hideHint);};
document.addEventListener('pointerdown',hideHint);document.addEventListener('keydown',hideHint);
loop();
})();
</script>
